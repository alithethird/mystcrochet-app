name: crochet_charts
description: A crochet chart editor for creating and visualizing crochet patterns
version: 1.0.17+18

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.0.10+1
  file_picker: ^8.0.0+1
  path: ^1.9.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  collection: ^1.18.0
  vector_math: ^2.2.0
  package_info_plus: ^9.0.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/stitches.json